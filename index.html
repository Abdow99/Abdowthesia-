<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdowthesia Pro</title>
    <style>
        :root { --primary: #20c997; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; --accent: #38bdf8; --warn: #fb7185; --rescue: #f43f5e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); padding: 10px; margin: 0; line-height: 1.4; }
        .container { max-width: 600px; margin: auto; }
        header { text-align: center; padding: 20px; background: var(--card); border-radius: 0 0 20px 20px; border-bottom: 4px solid var(--primary); margin-bottom: 15px; }
        .input-section { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-box { background: var(--card); padding: 12px; border-radius: 12px; flex: 1; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        label { display: block; font-size: 0.75rem; color: var(--primary); font-weight: bold; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; font-size: 1.1rem; font-weight: bold; box-sizing: border-box; }
        section { margin-top: 15px; }
        .section-title { color: var(--primary); font-size: 0.9rem; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; letter-spacing: 1px; }
        .card { background: var(--card); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
        .label { font-size: 0.75rem; color: #94a3b8; }
        .val { font-size: 1rem; font-weight: bold; color: var(--accent); }
        table { width: 100%; border-collapse: collapse; margin-top: 5px; }
        th { text-align: left; font-size: 0.75rem; color: #94a3b8; border-bottom: 1px solid #334155; padding: 5px; }
        td { padding: 10px 5px; border-bottom: 1px solid #334155; font-size: 0.85rem; vertical-align: middle; }
        .ml-col { color: var(--warn); font-weight: bold; font-size: 1.1rem; text-align: right; }
        .rescue-row { border-left: 4px solid var(--rescue); background: rgba(244, 63, 94, 0.1); }
        .infusion-row { border-left: 4px solid var(--accent); background: rgba(56, 189, 248, 0.1); }
        .badge { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; background: var(--rescue); color: white; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1 style="margin:0; font-size: 1.5rem; color: var(--primary);">Abdowthesia</h1>
        <small style="color: #94a3b8;">Senior Consultant Decision Support</small>
    </header>

    <div class="input-section">
        <div class="input-box">
            <label>Age (Years):</label>
            <input type="number" id="age" value="15" oninput="updateFromAge()">
        </div>
        <div class="input-box">
            <label>Weight (kg):</label>
            <input type="number" id="weight" value="50" oninput="calculate()">
        </div>
    </div>

    <section>
        <div class="section-title">🌬️ Airway & Ventilation</div>
        <div class="card grid-3">
            <div><div class="label">ETT Size</div><div id="ett" class="val">--</div></div>
            <div><div class="label">Depth (cm)</div><div id="depth" class="val">--</div></div>
            <div><div class="label">Suction</div><div id="suction" class="val">--</div></div>
            <div><div class="label">TV (mL)</div><div id="tv" class="val">--</div></div>
            <div><div class="label">RR (bpm)</div><div id="rr" class="val">--</div></div>
            <div><div class="label">MAC (Sevo)</div><div class="val">2.0%</div></div>
        </div>
    </section>

    <section>
        <div class="section-title">💧 Fluids (Holliday-Segar)</div>
        <div class="card grid-3">
            <div><div class="label">Maint (hr)</div><div id="maint" class="val">--</div></div>
            <div><div class="label">1st Hour</div><div id="hr1" class="val">--</div></div>
            <div><div class="label">Next 2 hrs</div><div id="hrNext" class="val">--</div></div>
        </div>
    </section>

    <section>
        <div class="section-title">💉 Drug Calculator (Local Dilutions)</div>
        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Drug (Concentration)</th>
                        <th>Dose</th>
                        <th style="text-align:right">Volume (mL)</th>
                    </tr>
                </thead>
                <tbody id="drug-list"></tbody>
            </table>
        </div>
    </section>
</div>

<script>
function updateFromAge() {
    const age = parseFloat(document.getElementById('age').value) || 0;
    let avgWeight = 0;
    
    if (age < 1) avgWeight = (age * 12 + 9) / 2;
    else if (age <= 8) avgWeight = (age * 2) + 8;
    else if (age < 18) avgWeight = (age * 3) + 7;
    else avgWeight = 70; 
    
    document.getElementById('weight').value = avgWeight.toFixed(0);
    calculate();
}

function calculate() {
    const w = parseFloat(document.getElementById('weight').value) || 0;
    const age = parseFloat(document.getElementById('age').value) || 0;
    
    let ett = (age < 1) ? 3.5 : (age >= 12 ? 7.5 : (age / 4) + 3.5);
    let depth = (age < 1) ? 10 : (age >= 12 ? 21 : (age / 2) + 12);
    
    let suctionSize = Math.floor(ett * 2);
    let suctionColor = "N/A";
    if (suctionSize <= 6) suctionColor = "Light Green";
    else if (suctionSize <= 8) suctionColor = "Blue";
    else if (suctionSize <= 10) suctionColor = "Black";
    else if (suctionSize <= 12) suctionColor = "White";
    else if (suctionSize <= 14) suctionColor = "Green";
    else suctionColor = "Orange";

    document.getElementById('ett').innerText = ett.toFixed(1);
    document.getElementById('depth').innerText = depth.toFixed(0) + " cm";
    document.getElementById('suction').innerText = suctionSize + " Fr (" + suctionColor + ")";
    document.getElementById('tv').innerText = (w * 7).toFixed(0) + "-" + (w * 8).toFixed(0);
    
    let rr = "12-16";
    if (age < 1) rr = "30-40";
    else if (age < 5) rr = "20-25";
    else if (age < 12) rr = "16-20";
    document.getElementById('rr').innerText = rr;

    let maint = (w <= 10) ? (w * 4) : (w <= 20 ? (40 + (w-10)*2) : (60 + (w-20)));
    let deficit = maint * 6;
    document.getElementById('maint').innerText = maint + " mL/h";
    document.getElementById('hr1').innerText = (maint + (deficit/2)).toFixed(0) + " mL";
    document.getElementById('hrNext').innerText = (maint + (deficit/4)).toFixed(0) + " mL/h";

    const drugData = [
        { name: "Adrenaline", prep: "1mL in 10mL", dose: w*0.01, unit: "mg", ml: (w*0.01/0.1), type: "rescue" },
        { name: "Ephedrine (Bolus)", prep: "Amp in 10mL", dose: 10, unit: "mg", ml: 3.3, type: "rescue" },
        { name: "Propofol (Induction)", prep: "200mg/20mL", dose: w*2, unit: "mg", ml: (w*2/10) },
        { name: "Fentanyl", prep: "100mcg/10mL", dose: w*2, unit: "mcg", ml: (w*2/10) },
        { name: "Atracurium", prep: "50mg/10mL", dose: w*0.5, unit: "mg", ml: (w*0.5/5) },
        { name: "Neostigmine", prep: "1 ml in 10mL", dose: w*0.05, unit: "mg", ml: (w*0.05/0.5) },
        { name: "Atropine", prep: "1 ml in 10mL", dose: w*0.01, unit: "mg", ml: (w*0.01/0.1) },
        { name: "Noradrenaline (Inf)", prep: "8mg in 50mL", dose: 0.05, unit: "mcg/kg/m", ml: (0.05*w*60/160), type: "inf" },
        { name: "Dexmedetomidine (Inf)", prep: "50mcg in 50mL", dose: 0.5, unit: "mcg/kg/h", ml: (0.5*w/1), type: "inf" },
        { name: "Midazolam (Bolus)", prep: "5mg/5mL", dose: w*0.05, unit: "mg", ml: (w*0.05/1) },
        { name: "Ketamine", prep: "100mg/10mL", dose: w*1.5, unit: "mg", ml: (w*1.5/10) },
        { name: "Paracetamol", prep: "1000mg/100mL", dose: w*15, unit: "mg", ml: (w*15/10) }
    ];

    let html = "";
    drugData.forEach(d => {
        let rowClass = "";
        if(d.type === 'inf') rowClass = "infusion-row";
        if(d.type === 'rescue') rowClass = "rescue-row";

        html += `<tr class="${rowClass}">
            <td><b>${d.name}</b>${d.type==='rescue'?'<span class="badge">RESCUE</span>':''}<br><small>${d.prep}</small></td>
            <td>${d.dose.toFixed(1)} ${d.unit}</td>
            <td class="ml-col">${d.ml.toFixed(d.type === 'inf' ? 2 : 1)} mL${d.type === 'inf' ? '/hr' : ''}</td>
        </tr>`;
    });
    document.getElementById('drug-list').innerHTML = html;
}
window.onload = updateFromAge;
</script>
</body>
</html>
