<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Abdowthesia Pro</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Abdowthesia">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a1a">

    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        :root { 
            --primary: #ef233c;      
            --bg: #1a1a1a;           
            --card-bg: #ffffff;      
            --text-dark: #2b2d42;    
            --text-light: #f8f9fa;   
            --gray: #8d99ae;
            --shadow: 0 10px 20px rgba(0,0,0,0.3);
            --border-radius: 14px;
        }

        html, body { overflow-x: hidden; width: 100%; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--bg); color: var(--text-light); line-height: 1.4; -webkit-text-size-adjust: 100%; }
        .container { width: 94%; max-width: 600px; margin: 0 auto; padding: 15px 0 50px 0; box-sizing: border-box; }
        header { text-align: center; padding: 25px 20px; background: var(--card-bg); border-radius: 20px; border-bottom: 6px solid var(--primary); box-shadow: var(--shadow); margin-bottom: 25px; color: var(--text-dark); }
        h1 { margin: 0; color: var(--primary); font-size: 1.8rem; letter-spacing: -0.5px; }
        .subtitle { color: var(--gray); font-size: 0.85rem; font-weight: 600; }

        .input-section { display: flex; gap: 10px; margin-bottom: 20px; width: 100%; }
        .input-box { background: var(--card-bg); padding: 12px; border-radius: var(--border-radius); flex: 1; box-shadow: var(--shadow); color: var(--text-dark); }
        label { display: block; font-size: 0.7rem; color: var(--primary); font-weight: 800; margin-bottom: 6px; text-transform: uppercase; }
        input { width: 100%; padding: 8px; border-radius: 10px; border: 2px solid #edf2f4; background: #f1f3f5; color: var(--text-dark); font-size: 1.4rem; font-weight: 900; box-sizing: border-box; text-align: center; }

        section { margin-top: 25px; width: 100%; }
        .section-title { color: var(--text-light); font-size: 1.05rem; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; text-transform: uppercase; }
        .section-title::before { content: ''; display: block; width: 6px; height: 18px; background: var(--primary); border-radius: 3px; }

        .card { background: var(--card-bg); border-radius: var(--border-radius); padding: 15px; box-shadow: var(--shadow); color: var(--text-dark); overflow: hidden; }
        .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; text-align: center; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; }

        .data-box { background: #f8f9fa; padding: 10px; border-radius: 10px; border: 1px solid #e9ecef; position: relative; }
        .label { font-size: 0.65rem; color: var(--gray); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
        .val { font-size: 1.1rem; font-weight: 800; color: var(--text-dark); }
        .val-highlight { color: var(--primary); font-size: 1.2rem; font-weight: 800; }

        table { width: 100%; border-collapse: collapse; margin-top: 5px; table-layout: fixed; }
        th { text-align: left; font-size: 0.65rem; color: var(--gray); border-bottom: 2px solid #edf2f4; padding: 10px 2px; font-weight: 800; text-transform: uppercase; }
        td { padding: 12px 2px; border-bottom: 1px solid #f1f3f5; font-size: 0.9rem; vertical-align: middle; color: var(--text-dark); }
        
        .drug-name { font-weight: 800; display: block; color: var(--text-dark); font-size: 0.9rem; }
        .drug-prep { font-size: 0.7rem; color: var(--gray); font-weight: 500; }
        .ml-col { color: var(--primary); font-weight: 900; font-size: 1.1rem; text-align: right; }
        
        /* Subtle Weight Badges */
        .w-badge { font-size: 0.55rem; padding: 1px 4px; border-radius: 4px; font-weight: 900; margin-left: 4px; vertical-align: middle; text-transform: uppercase; }
        .w-tbw { background: #e9ecef; color: #495057; }
        .w-ibw { background: #caf0f8; color: #0077b6; }
        .w-abw { background: #f3e5f5; color: #7b1fa2; }

        .drops-text { display: block; font-size: 0.65rem; color: #555; margin-top: 4px; font-weight: 700; font-style: italic; background: #fff3cd; padding: 2px 4px; border-radius: 4px; display: inline-block; }
        .cat-row td { background: #f1f3f5; color: var(--text-dark); font-weight: 900; font-size: 0.75rem; text-transform: uppercase; padding: 8px 12px; border-left: 4px solid var(--primary); }
        .alert { padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 0.8rem; font-weight: 800; display: none; text-align: center; box-shadow: var(--shadow); }
        .alert-warn { background: #ffbe0b; color: #000; }
        .alert-peds { background: var(--primary); color: #fff; }

        .btn-save { width: 100%; padding: 18px; background: var(--primary); color: white; border: none; border-radius: 15px; font-size: 1.05rem; font-weight: 900; cursor: pointer; margin-top: 25px; box-shadow: 0 4px 15px rgba(239, 35, 60, 0.4); text-transform: uppercase; }
        .footer-note { margin-top: 25px; padding: 10px; font-size: 0.7rem; color: var(--gray); line-height: 1.3; }
    </style>
</head>
<body>

<div class="container" id="app-content">
    <header>
        <h1>Abdowthesia Pro</h1>
        <div class="subtitle">Pediatric & Adult Anesthesia Guide</div>
    </header>

    <div class="input-section">
        <div class="input-box"><label>Age (Y)</label><input type="number" id="age" value="5" oninput="updateFromAge()" step="0.1"></div>
        <div class="input-box"><label>Weight (kg)</label><input type="number" id="weight" value="20" oninput="calculate()"></div>
    </div>
    
    <div id="peds-alert" class="alert alert-peds">👶 Pediatric Dosing Active</div>
    <div id="obese-alert" class="alert alert-warn">⚠️ Obesity: Dosing Adjusted (IBW/ABW)</div>

    <section>
        <div class="section-title">🌬️ Airway & Vent</div>
        <div class="card grid-3">
            <div class="data-box"><div class="label">ETT</div><div id="ett-size" class="val">--</div></div>
            <div class="data-box"><div class="label">Suction</div><div id="suction" class="val" style="font-size:0.8rem;">--</div></div>
            <div class="data-box"><div class="label">TV</div><div id="tidal-vol" class="val" style="font-size: 0.85rem;">--</div></div>
        </div>
    </section>

    <section>
        <div class="section-title">💉 Medications</div>
        <div class="card">
            <table>
                <thead><tr><th style="width:55%">Drug</th><th style="width:25%">Dose</th><th style="width:20%; text-align:right">Vol</th></tr></thead>
                <tbody id="drug-list"></tbody>
            </table>
        </div>
    </section>

    <section>
        <div class="section-title">⚠️ LA MAX (IBW)</div>
        <div class="card grid-2">
            <div class="data-box"><div class="label">Lido (3mg/kg)</div><div id="la-lido" class="val">--</div><span class="w-badge w-ibw" style="position:absolute;top:5px;right:5px;">IBW</span></div>
            <div class="data-box"><div class="label">Marc (2mg/kg)</div><div id="la-marcaine" class="val">--</div><span class="w-badge w-ibw" style="position:absolute;top:5px;right:5px;">IBW</span></div>
        </div>
    </section>
</div>

<div class="container">
    <button class="btn-save" onclick="saveAsImage()">📸 Save Clinical Summary</button>
    <div class="footer-note"><strong>Disclaimer:</strong> Calculation aid only. Verify all doses.</div>
</div>

<script>
function updateFromAge() {
    const age = parseFloat(document.getElementById('age').value) || 0;
    let avgW = (age < 1) ? (age * 12 + 9) / 2 : (age <= 8) ? (age * 2) + 8 : (age < 18) ? (age * 3) + 7 : 70;
    document.getElementById('weight').value = avgW.toFixed(avgW % 1 === 0 ? 0 : 1);
    calculate();
}

function calculate() {
    const w = parseFloat(document.getElementById('weight').value) || 0;
    const age = parseFloat(document.getElementById('age').value) || 0;
    let ibw = (age < 1) ? (age * 12 + 9) / 2 : (age <= 8) ? (age * 2) + 8 : (age < 18) ? (age * 3) + 7 : 70;
    const isObese = (w > ibw * 1.3 && age >= 12);
    const abw = isObese ? (ibw + 0.4 * (w - ibw)) : w;
    
    document.getElementById('obese-alert').style.display = isObese ? 'block' : 'none';
    document.getElementById('peds-alert').style.display = (age < 12) ? 'block' : 'none';

    // Airway Logic
    let suction = "Black";
    if (age < 1) suction = "Light Green";
    else if (age < 5) suction = "Blue";
    else if (age < 14) suction = "Black";
    else suction = "White";
    document.getElementById('suction').innerText = suction;
    document.getElementById('ett-size').innerText = (age < 1) ? "3.0-3.5" : (age/4 + 4).toFixed(1);
    document.getElementById('tidal-vol').innerText = `${(ibw*6).toFixed(0)}-${(ibw*8).toFixed(0)}ml`;

    const drugs = [
        { cat: "Induction", name: "Propofol", prep: "10mg/mL", dose: (age < 12 ? w*3 : abw*2), unit: "mg", ml: (age < 12 ? w*3 : abw*2)/10, wType: isObese ? "abw" : "tbw" },
        { cat: "Induction", name: "Fentanyl", prep: "10mcg/mL", dose: w*1.5, unit: "mcg", ml: (w*1.5)/10, wType: "tbw" },
        { cat: "Muscle Relaxant", name: "Atracurium", prep: "5mg/mL", dose: ibw*0.5, unit: "mg", ml: (ibw*0.5)/5, wType: "ibw" },
        { cat: "Muscle Relaxant", name: "Rocuronium", prep: "10mg/mL", dose: ibw*0.6, unit: "mg", ml: (ibw*0.6)/10, wType: "ibw" },
        { cat: "Reversal", name: "Neostigmine", prep: "0.25mg/mL", dose: w*0.05, unit: "mg", ml: (w*0.05)/0.25, wType: "tbw" },
        { cat: "Reversal", name: "Sugammadex", prep: "100mg/mL", dose: w*2, unit: "mg", ml: (w*2)/100, wType: "tbw" }
    ];

    let html = ""; let lastCat = "";
    drugs.forEach(d => {
        if(d.cat !== lastCat) { html += `<tr class="cat-row"><td colspan="3">${d.cat}</td></tr>`; lastCat = d.cat; }
        html += `<tr>
            <td><span class="drug-name">${d.name}</span><span class="drug-prep">${d.prep}</span></td>
            <td>${d.dose.toFixed(1)} ${d.unit}<span class="w-badge w-${d.wType}">${d.wType}</span></td>
            <td class="ml-col">${d.ml.toFixed(1)} mL</td>
        </tr>`;
    });
    document.getElementById('drug-list').innerHTML = html;

    // LA Max Logic
    let lidoMg = Math.min(ibw * 3, 300);
    document.getElementById('la-lido').innerText = `${(lidoMg/20).toFixed(1)}mL (${lidoMg.toFixed(0)}mg)`;
    let marcMg = Math.min(ibw * 2, 175);
    document.getElementById('la-marcaine').innerText = `${(marcMg/5).toFixed(1)}mL (${marcMg.toFixed(0)}mg)`;
}

async function saveAsImage() {
    const el = document.getElementById('app-content');
    const canvas = await html2canvas(el, { backgroundColor: "#1a1a1a", scale: 2 });
    canvas.toBlob(async (blob) => {
        const file = new File([blob], `Abdowthesia_${document.getElementById('weight').value}kg.png`, { type: 'image/png' });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: 'Anesthesia Summary' });
        } else {
            const link = document.createElement('a');
            link.download = `Summary.png`; link.href = canvas.toDataURL(); link.click();
        }
    });
}
window.onload = updateFromAge;
</script>
</body>
</html>
